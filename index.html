    <script>
      // Polyfill window.fetch setter to prevent Chrome extensions/interceptors from failing with:
      // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          try {
            Object.defineProperty(window, 'fetch', {
              value: _origFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (_) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return _origFetch; },
              set: function(fn) { _origFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}

        // Suppress external extension errors regarding fetch getter/setter
        window.addEventListener('error', function(e) {
          if (e && e.message && typeof e.message === 'string' && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
